<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check VTULE - Pompiers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <div class="header-content">
        <div id="vehicule-info">
            <!-- Rempli par le JS -->
            <h1>Chargement VTULE...</h1>
        </div>
        <div id="user-info-banner" class="hidden">
            <span id="connected-user-name"></span>
            <button id="btn-logout" class="btn-logout">Déconnexion</button>
        </div>
    </div>
</header>

<!-- Mode Inventaire & Actions globales -->
<div class="inventory-toggle-container">
    <button id="btn-toggle-inventory" class="btn-inventory-mode">📋 Activer le Mode Inventaire</button>
    <button id="btn-export-csv" class="btn-export">📥 Exporter le réassort (CSV)</button>
    <button id="btn-view-history" class="btn-history">🕒 Voir l'historique</button>
</div>

<!-- Barre de recherche pour filtrer le matériel en temps réel -->
<div class="search-container">
    <input type="text" id="search-input" placeholder="🔍 Rechercher un matériel ou un emplacement..." aria-label="Rechercher un matériel ou un emplacement">
</div>

<!-- Zone d'alerte critique -->
<div id="alert-banner" class="hidden">
    ⚠️ ATTENTION : Du matériel est périmé ou abîmé !
</div>

<main>
    <section id="sac-prompt-secours">
        <h2>Sac Prompt Secours</h2>
        <div class="materiaux-liste" id="liste-prompt-secours"></div>
    </section>

    <section id="sac-oxygenation">
        <h2>Sac Oxygénation</h2>
        <div class="materiaux-liste" id="liste-oxygenation"></div>
    </section>

    <section id="materiel-general">
        <h2>Matériel Général</h2>
        <div class="materiaux-liste" id="liste-general"></div>
    </section>
</main>

<!-- Modale d'édition de matériel -->
<div id="edit-modal" class="modal-overlay hidden">
    <div class="modal-content">
        <h3>Modifier le matériel</h3>
        <form id="edit-form">
            <input type="hidden" id="edit-id">
            
            <div class="form-group">
                <label for="edit-nom">Nom du matériel</label>
                <input type="text" id="edit-nom" required>
            </div>
            
            <div class="form-group">
                <label for="edit-quantite">Quantité</label>
                <input type="number" id="edit-quantite" min="0" required>
            </div>
            
            <div class="form-group">
                <label for="edit-date">Date de péremption</label>
                <input type="date" id="edit-date">
                <small>Laisser vide si non périssable</small>
            </div>
            
            <div class="form-group">
                <label for="edit-statut">Statut</label>
                <select id="edit-statut" required>
                    <option value="Opérationnel">Opérationnel</option>
                    <option value="Non opérationnel">Non opérationnel</option>
                </select>
            </div>
            
            <div class="modal-actions">
                <button type="button" id="btn-cancel-edit" class="btn-cancel">Annuler</button>
                <button type="submit" class="btn-save">Sauvegarder</button>
            </div>
        </form>
    </div>
</div>

<!-- Modale de Connexion (Obligatoire) -->
<div id="login-modal" class="modal-overlay hidden" style="z-index: 9999;">
    <div class="modal-content login-content">
        <h3>Identification requise</h3>
        <p>Veuillez vous identifier pour accéder au contrôle du matériel.</p>
        <form id="login-form">
            <div class="form-group">
                <label for="login-grade">Grade</label>
                <select id="login-grade" required>
                    <option value="" disabled selected>Sélectionnez un grade</option>
                    <option value="Sap.">Sapeur</option>
                    <option value="Cap.">Caporal</option>
                    <option value="Sgt.">Sergent</option>
                    <option value="Adj.">Adjudant</option>
                    <option value="Ltn.">Lieutenant</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="login-nom">Nom de famille</label>
                <input type="text" id="login-nom" placeholder="Ex: Dupont" required>
            </div>
            
            <div class="modal-actions">
                <button type="submit" class="btn-save" style="width: 100%;">Se connecter</button>
            </div>
        </form>
    </div>
</div>

<!-- Modale d'Historique -->
<div id="history-modal" class="modal-overlay hidden">
    <div class="modal-content history-content">
        <h3>Historique des modifications</h3>
        <div id="history-list" class="history-list">
            <!-- Liste des logs remplie par JS -->
        </div>
        <div class="modal-actions" style="justify-content: space-between;">
            <button type="button" id="btn-clear-history" class="btn-cancel" style="background-color: #dc3545;">Effacer l'historique</button>
            <button type="button" id="btn-close-history" class="btn-save">Fermer</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
